<!doctype html><html lang="th"><head><meta charset="utf-8"><title>NangLung — Character pose matrix</title><style>body{background:#f7f2e6;color:#493e2e;font-family:Thonburi,Tahoma,sans-serif;margin:24px}h1{font-size:22px}p{font-size:12px;color:#8d7a5b}.matrix{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.cell{background:#fff9e9;border:1px solid #dbcfb9;padding:8px;border-radius:6px}.cell>div{display:flex;justify-content:space-between;font-size:11px}.cell>svg{display:block;width:100%;height:300px}</style></head><body><h1>ตรวจท่าตัวละคร 0% / 50% / 100%</h1><p>ใช้ข้อมูลเวกเตอร์และโครงข้อต่อชุดเดียวกับ Canvas · แถวกลางกลับทิศ · ตรวจด้วยสายตาประกอบ unit tests</p><div class="matrix" id="matrix"></div><script type="module">
import{CHARACTERS,characterSvg}from'/src/characters.ts';
document.getElementById('matrix').innerHTML=[0,.5,1].flatMap(value=>CHARACTERS.map(c=>{
 let svg=characterSvg(c,{mouth:value,head:value*.55,leftArm:value,rightArm:value},`matrix-${c.id}-${value}`);
 if(value===.5)svg=svg.replace(/(<title[^>]*>[^<]*<\/title>)/,'$1<g transform="scale(-1 1)">').replace('</svg>','</g></svg>');
 return `<section class="cell"><div><strong>${c.name}</strong><span>${value*100}%${value===.5?' · หันซ้าย':''}</span></div>${svg}</section>`;
})).join('');
</script></body></html>
