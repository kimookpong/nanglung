<!doctype html><html lang="th"><head><meta charset="utf-8"><title>NangLung — Viewport layout check</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee7d9}iframe{display:block;border:0;transform-origin:top left}</style></head><body><script type="module">
const query=new URLSearchParams(location.search);
const width=Math.max(320,Math.min(1920,Number(query.get('width'))||1366));
const height=Math.max(320,Math.min(1200,Number(query.get('height'))||768));
const frame=document.createElement('iframe');frame.title=`สตูดิโอ ${width} × ${height}`;
frame.width=String(width);frame.height=String(height);
frame.src=query.get('dialog')==='calibration'?'/tests/calibration-layout.html':'/';
document.body.append(frame);
function fitPreview(){frame.style.transform=`scale(${Math.min(1,innerWidth/width,innerHeight/height)})`;}
fitPreview();addEventListener("resize",fitPreview);
</script></body></html>
