<!doctype html><html lang="th"><head><meta charset="utf-8"><title>NangLung — Share image</title>
<style>html,body{margin:0;background:#211d19;overflow:hidden}canvas{display:block;width:1280px;height:720px;transform-origin:0 0;transform:scale(.9375)}</style></head>
<body><canvas id="stage"></canvas><script type="module">
// Source of public/og-image.jpg: the real stage renderer with the whole cast,
// shown at 1200×630 (cover crop). Capture it with a 1200×630 viewport.
import { StageRenderer } from '/src/renderer.ts';
import { defaultSettings, restPose } from '/src/core.ts';
const renderer = new StageRenderer(document.getElementById('stage'));
const settings = defaultSettings();
const cast = [['theng',.10,'Left'],['thaksin',.255,'Left'],['prayut',.40,'Left'],['anutin',.60,'Right'],['thanathorn',.745,'Right'],['prawit',.90,'Right']];
const actors = cast.map(([character,x,side]) => ({ key: character, character,
  pose: { ...restPose(), facing: side === 'Left' ? 1 : -1, rightArm: character === 'prawit' ? .55 : .16 },
  placement: { x, baseline: 655, scale: .92, lean: 0, side } }));
const draw = (now) => { renderer.drawActors(actors, settings, false, now); requestAnimationFrame(draw); };
requestAnimationFrame(draw);
</script></body></html>
